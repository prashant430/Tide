<div class="navigation-bar flex-display w-full">
  {% for nav in site.data.main_nav.navigation %}
    {% assign current_path = page.url | replace: '.html','' %}
    <a href="{{ nav.url }}"
       pp="{{ page.url }}"
       class="{{ nav.class }} filter-grid-button {{ page.hide-nav }}{% if current_path == nav.url %} active{% endif %}">
       {{ nav.title }}
    </a>
  {% endfor %}
</div>
