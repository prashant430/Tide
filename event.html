<script>
document.addEventListener("DOMContentLoaded", function () {
  let swiperInstance; 
  function initOrDestroySwiper() {
    const screenWidth = window.innerWidth;
    if (screenWidth > 767 && !swiperInstance) {
      swiperInstance = new Swiper(".swiper-desktop", {
        spaceBetween: 50,
        slidesPerView: 2.5,
        breakpoints: {
          768: { slidesPerView: 2.2, spaceBetween: 15 },
          1024: { slidesPerView: 2.3, spaceBetween: 50 },
        },
      });
    } else if (screenWidth <= 767 && swiperInstance) {
      swiperInstance.destroy(true, true);
      swiperInstance = null;
    }
  }
  initOrDestroySwiper();
  window.addEventListener("resize", initOrDestroySwiper);
});
</script>
