cards:
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue11-environment-5.jpg
    alt: 'A Letter from Norway '
    link: /articles/letter-from-norway
    tags:
      - Environment
      - number 11
    title: 'A Letter from Norway '
    description: ' The Nordic country’s dramatic fjords are a major drawcard for the millions who travel to see the local landscape each year. We explore how the uniquely wild water wonders are currently being future-proofed '
  - image: >-
      /uploads/tide-magazine-sailing-lifestyle-travel-issue10-environment-1-1.jpg
    alt: ' Evolving Modernism '
    link: /articles/pianosa
    tags:
      - Environment
      - number 10
    title: ' The Force Of Nature '
    description: ' After centuries of being both fought over and neglected, today the tiny isle of Pianosa has become a precious international case in the promising power of rewilding. We investigate how such an evolution came about '
  - image: >-
      /uploads/tide-magazine-sailing-lifestyle-travel-issue09-environment-seatrees-1.jpg
    alt: ' Life in the Meadows '
    link: /articles/sea-trees
    tags:
      - 'Environment '
      - number 09
    title: ' Life in the Meadows '
    description: ' Seagrass meadows, among the oldest life on earth, are our secret weapon in fighting climate change. But these hidden forests are under threat. Luckily, a Mallorcan project is diving in to help save them '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue08-environment-1.jpg
    alt: ' Atoll Protected '
    link: /articles/atoll-protected
    tags:
      - 'Environment '
      - number 08
    title: ' Atoll Protected '
    description: ' As it undertakes its mission to conserve the islet’s special environment and culture, the hard-working Teti’aroa Society has also sketched out a pathway for the restoration of oceanic islands in general '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue07-environment3.jpg
    alt: ' Dominica And The Whales '
    link: /articles/dominica-whales
    tags:
      - Environment
      - number 07
    title: ' Dominica And The Whales '
    description: ' With a massive decline in the global Sperm whale population caused by a combination of hunting, pollution and climate change, the species is in grave danger. But things are set to change thanks to an ambitious plan by an unlikely ally '
