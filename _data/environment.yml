      link: /articles/veer
      tags:
        - Environment
        - ' number 05'
      title: 'The Winds of Change '
      description: ' Casting aside conventional norms, Danielle Southcott is charting a revolutionary new course in maritime shipping. With a groundbreaking new sailing cargo ship powered by the wind and clean hydrogen fuel, Veer is setting a new standard for eco-responsible practices on the high seas. '
    - image: /uploads/tide-magazine-issue04-conscious-traveller-3-1.jpg
      alt: ' The Conscious Traveller '
      link: /articles/conscious-traveller
      tags:
        - 'Environment '
        - number 04
      title: ' The Conscious Traveller '
      description: ' More and more, the sailing Superyacht community are looking for ways to add meaning and purpose to their travels without compromising on luxury. Here, we look at a few companies working to connect owners and sailors with conservationists, creating a more positive impact on local flora, fauna, and communities '
    - image: /uploads/tide-magazine-issue04-11th-hour.jpg
      alt: Three's a Charm
      link: /articles/11th-hour
      tags:
        - Environment
        - number 04
      title: 'The 11th Hour '
      description: ' Using the power of sport and travel to restore a balanced relationship between people and planet, 11th Hour Racing are working against the clock to enable others to protect and restore the health of our ocean '
