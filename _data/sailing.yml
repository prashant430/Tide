cards:
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue12-sarissa-1.jpg
    alt: ' Sailing I number 12'
    link: /articles/sarissa
    tags:
      - ' Sailing '
      - number 12
    title: ' On Point:  Supersloop Sarissa '
    description: ' The 60m Sarissa, named after the ancient Greek word for a long, sharp spear, is cutting-edge in every way, from her record-holding square-top mainsail to her impressive speed and unique quietness. We meet her designer Malcolm McKeon and Captain Iain Cook to find out her secret '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue11-wind-4.jpg
    alt: Three's a Charm
    link: /articles/wind-is-power
    tags:
      - Sailing
      - I number 11
    title: ' Wind is Power '
    description: ' The latest rig and sail innovations are allowing boatbuilders and designers to think big when it comes to sailing vessels – and that is good news for the environment '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue11-nilaya-1.jpg
    alt: ' Nilaya Rises '
    link: /articles/nailaya
    tags:
      - ' Sailing '
      - number 11
    title: ' Nilaya Rises '
    description: ' Introducing the seaborne giant with the featherlight touch – we meet Captain Romke Loopik and find out the many ways this ‘boat made for sailing’ moves both him and her hands-on owner '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue11-spirits-1.jpg
    alt: ' Competitive Spirits '
    link: /articles/competitive-spirits
    tags:
      - ' Sailing'
      - number 11
    title: ' Competitive Spirits '
    description: ' Two modern 100ft wooden yachts raced head-to-head in Sweden last year. Sam Fortescue hears how history was made '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue10-maximus-1.jpg
    alt: ' Maximus The Ocean Gladiator  '
    link: /articles/maximus
    tags:
      - ' Sailing '
      - number 10
    title: ' Maximus The Ocean Gladiator  '
    description: ' Meet the Superyacht that manages to both dominate at regattas and boast the latest in onboard luxury '
cards2:
  - image: /uploads/tide-magazine-sailing-supersloop-1-1.jpg
    alt: ' The Rise of the Supersloop '
    link: /articles/supersloop
    tags:
      - ' Sailing '
      - number 01
    title: ' The Rise of the Supersloop '
    description: ' The super sloop, the apex of sailing superyachts? '
  - image: /uploads/tide-magazine-sailing-the-cat-is-back-1-1.jpg
    alt: ' The Cat is Back '
    link: /articles/the-cat-is-back
    tags:
      - ' Sailing'
      - number 01
    title: ' The Cat is Back '
    description: >2-
       The insatiable desire for more than one hull continues unabated and whilst the industry seeks to meet demand, one yard at the sharp end of the market is already raising the bar.
      (utilising race boat technology to deliver high performance in a high- end
      package. Gunboat are targeting their 68’, 72’ and 80’ models to fill a gap
      in the market by combining the generous square meterage of the cruising
      catamaran with the thrilling performance of offshore racing multihulls.) 
  - image: /uploads/tide-magazine-travel-new-york-1-1.jpg
    alt: ' Sailing in the City - New York '
    link: /articles/new-york
    tags:
      - ' Travel '
      - number 01
    title: ' Sailing in the City - New York '
    description: ' New York City reserves some of its most spectacular panoramas for those lucky enough to visit by boat. '
  - image: /uploads/tide-magazine-sailing-modern-ketch-1-1.jpg
    alt: ' The Modern Ocean Ketch '
    link: /articles/modern-ketch
    tags:
      - ' Sailing '
      - number 01
    title: ' The Modern Ocean Ketch '
    description: ' The heritage of the modern ocean ketch comprises many of the world’s most iconic yachts and, whilst the latest creations are larger, faster and more technologically advanced, they continue to prove why the twin rig concept ticks all the boxes. '
  - image: /uploads/futureisnow.jpg
    alt: ' The Future is Now '
    link: /articles/future-is-now
    tags:
      - ' Sailing'
      - number 01
    title: ' The Future is Now '
    description: ' At the dawn of the early Twenties, we find ourselves on the threshold of a new era in sailing; the America’s Cup enacted at speeds in excess of 40 knots and the drive towards environmental responsibility set against a backdrop of ever larger motor yacht builds. So, what does the future hold for the humble sailing yacht? '
content_on_image:
  image: /images/tide-banner2.png
  alt: TIDE's Top Ten Sailing Destinations
  tags:
    - Travel
    - Number 11
  title: TIDE's Top Ten Sailing Destinations
  description: >-
    For decades, sailors have set a course for the Cyclades, but not only for
    its myriad cultural attractions, sandy beaches, hidden coves and gin-clear
    seas.
  button:
    text: More
    link: /destinations
    class: width-fit btn white-btn
