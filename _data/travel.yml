cards:
  - image: /uploads/download-8.jpg
    alt: ' The High Low '
    link: /articles/high-low-south-america
    tags:
      - ' Travel I'
      - ' number 12'
    title: ' The High Low '
    description: ' These two beach spots offer barefoot escapes in South America: one firmly on the Atlantic Ocean in Uruguay, the other hidden away in the turquoise Caribbean in Colombia. Each is paradisiacal, just with different vibes '
  - image: /uploads/download-9.jpg
    alt: ' Sailing Cuba '
    link: /articles/itinerary-cuba
    tags:
      - ' Travel I '
      - number 12
    title: ' Sailing Cuba '
    description: ' The North American island nation has so much more beyond Havana, from isolated sandy cays to lively, vibrant city centres. Here, Cuba-born Maria Romeu, founder of CubaPlus Travel agency, has planned your visit for you '
  - image: /uploads/download-10.jpg
    alt: ' Hidden Gems: Islas Secas '
    link: /articles/hidden-gems-islas-secas
    tags:
      - ' Travel I '
      - number 12
    title: ' Hidden Gems: Islas Secas '
    description: ' Explore this relatively undiscovered archipelago off Panama’s Gulf of Chiriquí for both natural, untamed wonders and the last word in eco-luxe '
  - image: /uploads/download-11.jpg
    alt: ' Checking in: Refugia Chiloé '
    link: /articles/refugia-chiloe
    tags: []
    title: ' Checking in: Refugia Chiloé '
    description: ' This just-rebranded island retreat is as welcoming and soul-reviving as its name suggests. Nicola Chilton shares what to expect following her stay, from ravishing sunsets to unique local dishes and bathtubs with a view '
  - image: /uploads/download-12.jpg
    alt: ' Checking in: Posada Ayana '
    link: /articles/posada-ayana
    tags: []
    title: ' Checking in: Posada Ayana '
    description: ' Originally from Austria, Edda and Robert Kofler relocated to the tiny Uruguayan village of José Ignacio and never looked back. The result? An elegant, modern hotel with ocean views and the kind of calm one would cross oceans for '
  - image: /uploads/download-13.jpg
    alt: ' Sailing Stockholm '
    link: /articles/sailing-stockholm
    tags: []
    title: ' Sailing Stockholm '
    description: ' There’s a simple beauty in the stillness of Stockholm’s archipelago. With tens of thousands of isles, the region offers an itinerary very much intended to slow one down: think straight-forward food and the easy pleasure of days spent immersed in nature  '
  - image: /uploads/download-14.jpg
    alt: ' Hidden Gems: Project Ö, Skjulskäret '
    link: /articles/project-o
    tags: []
    title: ' Hidden Gems: Project Ö, Skjulskäret '
    description: ' With a growing number of smart eco-focused stays across the Finnish archipelago, this little-known part of the world is having a – very quiet – moment  '
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue11-hermitage-2.jpg
    alt: ' Checking In: Hermitage Bay, Antigua '
    link: /articles/hermitage-bay
    tags: []
    title: ' Checking In: Hermitage Bay, Antigua '
    description: ' The Antiguan hideaway is open once more following a large-scale but sensitive update. We met with new owner, Daniel Shamoon, to find out more    '
content_on_image:
  image: /images/tide-banner2.png
  alt: TIDE's Top Ten Sailing Destinations
  tags:
    - Travel
    - Number 11
  title: TIDE's Top Ten Sailing Destinations
  description: >-
    For decades, sailors have set a course for the Cyclades, but not only for
    its myriad cultural attractions, sandy beaches, hidden coves and gin-clear
    seas.
  button:
    text: More
    link: /destinations
    class: width-fit btn white-btn
featured_section:
  cards:
    - image: /uploads/download-15.jpg
      alt: ' Checking In: Bawah Reserve, Indonesia '
      link: /articles/bawah-reserve
      tags:
        - ' Travel I'
        - ' number 11'
      title: ' Checking In: Bawah Reserve, Indonesia '
      description: ' This unique eco-resort offers guests a life-giving sojourn in the arms of Mother Nature '
    - image: /uploads/download-16.jpg
      alt: ' Three''s a Charm '
      link: /articles/hotel-mezzatore
      tags:
        - ' Travel I '
        - number 10
      title: ' Three''s a Charm '
      description: ' On the island of Ischia, one family has brought Italy’s ‘good life’ to a historic watchtower – by transforming it into their third smart hotel '
    - image: /uploads/download-17.jpg
      alt: ' The High Low: Elba '
      link: /articles/high-low-elba
      tags:
        - ' Travel I '
        - number 10
      title: ' The High Low: Elba '
      description: ' If you’re going to drink sundowners overlooking the Med and eat pasta in Italy – do it right. Introducing Elba’s Ibiza-infused Bleep bar and Ischia’s thoroughly Italian La Baia restaurant, which are each as different as they are exciting '
    - image: /uploads/download-18.jpg
      alt: ' La Dolce Vita Itinerary '
      link: /articles/dolce-vita
      tags:
        - ' Travel I'
        - ' number 10'
      title: ' La Dolce Vita Itinerary '
      description: ' From imperial Elba to rustic Ponza, here’s a sailing schedule that serves up the innately Italian ‘good life’ via idyllic landscapes, laid-back living and consistently phenomenal food and innovative techniques to create a food legacy all of its own.  Here, Maria Sollivellas, Chef and co-owner of Restaurant Ca na Toneta,  celebrates her home’s past and present with a much-loved intrinsic dish '
cards2:
  - image: /uploads/download-19.jpg
    alt: ' Hidden Gems: Elba '
    link: /articles/elba
    tags:
      - ' Travel I '
      - number 10
    title: ' Hidden Gems: Elba '
    description: ' Look beyond the overly repeated fact that Napoleon was briefly exiled here to discover many other intriguing twists and tales about this particular Tuscany-on-Sea  '
  - image: /uploads/download-20.jpg
    alt: ' The High Low: Ibiza '
    link: /articles/high-low-ibiza
    tags:
      - ' Travel I '
      - number 09
    title: ' The High Low: Ibiza '
    description: ' All those who visit Spain know she’s a culinary wonderland. Ibiza is no different. This tale of two restaurants is the perfect example of what makes the nation’s gastronomic legacy so great: its restaurants are out to impress '
  - image: /uploads/download-21.jpg
    alt: ' Sun Kissed Shores: The Balearics '
    link: /articles/balearics
    tags:
      - ' Travel I '
      - number 09
    title: ' Sun Kissed Shores: The Balearics '
    description: ' A yachting playground synonymous with sunshine and sophistication, for the seasoned sailor Spain’s renowned archipelago harbours a treasure trove of nautical experiences '
  - image: /uploads/download-22.jpg
    alt: 'Hidden Gems: Menorca '
    link: /articles/hidden-gems-menorca
    tags: []
    title: ' Hidden Gems: Menorca '
    description: ' More peaceful than sister islands Ibiza and Mallorca and with UNESCO status as a Biosphere Reserve, this Balearic may offer as close to an unspoilt paradise as you can get  '
  - image: /uploads/download-23.jpg
    alt: ' Checking In: Petunia Hotel, Ibiza '
    link: /articles/petunia-hotel
    tags: []
    title: ' Checking In: Petunia Hotel, Ibiza '
    description: ' Step into a world of tranquillity, where nature reigns and Balearic flavours tantalise the palate '
  - image: /uploads/download-24.jpg
    alt: ' The High Low: French Polynesia '
    link: /articles/the-brando
    tags: []
    title: ' The High Low: French Polynesia '
    description: ' French Polynesia brings to mind ambrosia; lush days spent lounging on chalk-fine sand, crystalline waters lapping gently along the shore. But there’s more to this archipelago nation than palm trees and beaches, and one way to get to know her is through her rich food heritage '
  - image: /uploads/download-25.jpg
    alt: ' Hidden Gems: Teti’aroa, French Polynesia '
    link: /articles/tetiaroa
    tags: []
    title: ' Hidden Gems: Teti’aroa, French Polynesia '
    description: ' It was the dreamily secluded island atoll that stole Marlon Brando’s heart. Now, with a flock of celebrities using it as their get-off-the-grid getaway, Teti’aroa’s own star status is rising even higher, thanks to its stunning vistas, exceptional food and incredible backstory as an elite royal Tahitian retreat '
  - image: /uploads/download-26.jpg
    alt: ' French Polynesia '
    link: /articles/french-polynesia
    tags: []
    title: ' French Polynesia '
    description: ' While the Marquesas have unmissable mountains, the Windward Islands have enormous pods of humpback whales and the Tuamotus have some of the most stunning natural shows on earth. Here are all the places to make the very most of all these sensational islands  '
  - image: /uploads/download-27.jpg
    alt: ' Checking In: Le Taha''a '
    link: /articles/le-tahaa
    tags: []
    title: ' Checking In: Le Taha''a '
    description: ' There’s a subtle scent of vanilla flower mixed in with the gentle breeze that’s pulling in salty sea air. Underfoot is the palest blue-turquoise water of a shallow lagoon. Ahead: nothing but the horizon. This is Le Taha’a by Pearl Resorts, an award-winning resort by a motu of the same name '
  - image: /uploads/download-28.jpg
    alt: ' The Kamalame Cay '
    link: /articles/kamalame-cay
    tags: []
    title: ' The Kamalame Cay '
    description: ' Under the careful watch of the Hew family, an untouched strip of sand in the Bahamas was transformed into Kamalame Cay, a laidback private-island resort  '
